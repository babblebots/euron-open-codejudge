# Babblebots staging: all of Euron on one t4g.medium (2 CPUs, 4 GB).
# Derived from deploy/compose/compose.yaml. Differences: production mode, S3 for
# test packages, no emulator/mailpit/mock-ai, one judge with ceilings lowered to
# fit 4 GB, and Caddy in front of the API for HTTPS.
# .env is written by render-env.sh from SSM Parameter Store; never commit it.
name: euron

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-api-env: &api-env
  ENVIRONMENT: production
  CODEJUDGE_CLOUD: aws
  LOG_LEVEL: INFO
  PORT: "8080"
  DATABASE_URL: postgresql+asyncpg://codejudge:${POSTGRES_PASSWORD}@postgres:5432/codejudge
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET}
  INVITE_TOKEN_PEPPER: ${INVITE_TOKEN_PEPPER}
  LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY}
  JUDGE_TOKEN: ${JUDGE_TOKEN}
  KEY_MODE: local
  STORAGE: s3
  OBJECTS_BUCKET: ${OBJECTS_BUCKET}
  AWS_REGION: ap-south-1
  COOKIE_SECURE: "true"
  # Caddy proxies on the Compose network; nothing else can reach the api port.
  FORWARDED_ALLOW_IPS: "*"
  # The candidate interview room calls the API from the browser.
  CORS_ORIGINS: ${CORS_ORIGINS}
  PUBLIC_URL: https://${EURON_HOSTNAME}
  # Production mode refuses MAIL_BACKEND=log. Nothing is ever sent: Babblebots
  # invites with deliver_email=false (the fork patch), and no relay listens here.
  MAIL_BACKEND: smtp
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "25"

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: codejudge
      POSTGRES_USER: codejudge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codejudge -d codejudge"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  # noeviction: queued judge jobs must never be evicted to make room for a cache entry.
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [default, judge]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  migrate:
    image: ${REGISTRY}/euron-api:${TAG}
    command: ["migrate"]
    environment: { <<: *api-env }
    read_only: true
    tmpfs: ["/tmp:uid=10001,gid=10001"]
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    logging: *logging

  api:
    image: ${REGISTRY}/euron-api:${TAG}
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment: { <<: *api-env }
    read_only: true
    tmpfs: ["/tmp:uid=10001,gid=10001"]
    networks: [default, judge]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  worker:
    image: ${REGISTRY}/euron-api:${TAG}
    command: ["worker"]
    environment: { <<: *api-env }
    read_only: true
    tmpfs: ["/tmp:uid=10001,gid=10001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9464/metrics', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  # One judge. Security settings exactly as upstream: every capability dropped,
  # no new privileges, the judge seccomp profile, read-only root. On the internal
  # `judge` network it reaches the api and redis only: no Postgres, no S3, no
  # internet, no instance metadata.
  # ponytail: ceilings cut from upstream's 4g / 1g / 1.2g to fit a 4 GB machine
  # (our problems cap at 256 MB with tiny test packages). On a t4g.large or
  # bigger, restore upstream's numbers.
  judge:
    image: ${REGISTRY}/euron-judge:${TAG}
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      API_INTERNAL_URL: http://api:8080
      REDIS_URL: redis://redis:6379/0
      JUDGE_TOKEN: ${JUDGE_TOKEN}
      WORK_DIR: /tmp/judge
      CACHE_DIR: /var/cache/codejudge
      CACHE_MAX_BYTES: "400000000"
      LANGUAGES_FILE: /etc/euron/languages.yaml
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./judge-seccomp.json
    read_only: true
    volumes:
      - ./languages.yaml:/etc/euron/languages.yaml:ro
    tmpfs:
      - /tmp:exec,size=600m,uid=10001,gid=10001,mode=0700
      - /var/cache/codejudge:size=500m,uid=10001,gid=10001,mode=0700
    pids_limit: 512
    # nsjail gives each run a 64 MB stack (RLIMIT_STACK, soft and hard). Docker on
    # Amazon Linux starts containers with a lower hard stack limit, so that setrlimit
    # is refused and every submission is IE ("Couldn't launch the child process").
    # Docker Desktop has no such cap, which is why this never shows locally.
    ulimits:
      stack: { soft: 8388608, hard: -1 }
    mem_limit: 2500m
    cpus: 2
    networks: [judge]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  # Euron's own staff UI. Not published: reach it with an SSM port forward.
  web:
    image: ${REGISTRY}/euron-web:${TAG}
    environment:
      API_INTERNAL_URL: http://api:8080
      PORT: "3000"
    ports: ["127.0.0.1:3000:3000"]
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000
      - /app/.next/cache:uid=1000,gid=1000
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  # HTTPS for the API only, with an automatic Let's Encrypt certificate.
  caddy:
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443"]
    environment:
      EURON_HOSTNAME: ${EURON_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

networks:
  default:
  # Only the api, redis and the judge: a compromised judge sees nothing else.
  judge:
    internal: true

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
